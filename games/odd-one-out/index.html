<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>หาภาพที่ไม่เข้าพวก - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .odd-stage {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 650px;
            width: 100%;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
        }
        .odd-hint {
            font-size: 1.35rem;
            font-weight: 700;
            color: #c2410c;
            margin-bottom: 24px;
            text-align: center;
        }
        .odd-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 500px;
        }
        .odd-card {
            background: #ffffff;
            border: 4px solid #fed7aa;
            border-radius: 24px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #fdba74, 0 10px 15px rgba(0,0,0,0.06);
            transition: all 0.15s;
            position: relative;
        }
        .odd-card:hover {
            transform: translateY(-2px);
            border-color: #f97316;
        }
        .odd-card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #fdba74;
        }
        .odd-card.correct {
            border-color: #22c55e;
            background: #f0fdf4;
            box-shadow: 0 6px 0 #86efac;
            animation: bounce 0.6s;
        }
        .odd-card.wrong {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .odd-num {
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #9a3412;
            background: #ffedd5;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .odd-emoji {
            font-size: 4rem;
            margin-bottom: 6px;
        }
        .odd-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <span class="title-emoji">🔍</span>
            <h1 class="game-title">หาภาพที่ไม่เข้าพวก</h1>
            <span class="title-emoji">👀</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าหลัก">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-restart" class="btn-icon" title="เริ่มใหม่ (สุ่มใหม่)">
                <span>🔄</span> <span class="btn-text">สุ่มด่านใหม่</span>
            </button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">⭐</span>
            <span>ข้อที่: <strong id="current-q">1</strong> / 5</span>
        </div>
        <div class="status-item">
            <span class="status-icon">🏆</span>
            <span>คะแนน: <strong id="score">0</strong></span>
        </div>
    </div>

    <main class="odd-stage">
        <div class="odd-hint">ภาพไหนไม่เหมือนเพื่อนๆ หรือไม่เข้าพวกเอ่ย? แตะเลย! 🧐</div>
        <div class="odd-grid" id="odd-grid">
            <!-- 4 การ์ดสุ่ม -->
        </div>
    </main>

    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-trophy">🏆</div>
            <h2 class="modal-title">สุดยอดนักสืบน้อย!</h2>
            <p class="modal-subtitle">หนูช่างสังเกตมาก หาภาพที่ไม่เข้าพวกเจอครบทุกข้อเลย!</p>
            <div class="modal-stars">⭐⭐⭐</div>
            <button id="btn-play-again" class="btn-play-again">🎮 สุ่มด่านเล่นอีกรอบ!</button>
        </div>
    </div>

    <script src="../../sounds.js"></script>
    <script>
        // คลังหมวดหมู่สุ่มแบบไม่จำกัด
        const CATEGORIES = [
            {
                name: 'ผลไม้',
                items: [
                    { e: '🍎', n: 'แอปเปิ้ล' }, { e: '🍌', n: 'กล้วย' }, { e: '🍊', n: 'ส้ม' },
                    { e: '🍇', n: 'องุ่น' }, { e: '🍓', n: 'สตรอว์เบอร์รี' }, { e: '🍉', n: 'แตงโม' },
                    { e: '🍍', n: 'สับปะรด' }, { e: '🍑', n: 'พีช' }
                ]
            },
            {
                name: 'สัตว์',
                items: [
                    { e: '🐶', n: 'น้องหมา' }, { e: '🐱', n: 'น้องแมว' }, { e: '🐰', n: 'กระต่าย' },
                    { e: '🦁', n: 'สิงโต' }, { e: '🐘', n: 'พี่ช้าง' }, { e: '🐼', n: 'แพนด้า' },
                    { e: '🐵', n: 'ลิงจ๋อ' }, { e: '🐸', n: 'กบน้อย' }, { e: '🐻', n: 'น้องหมี' }
                ]
            },
            {
                name: 'ยานพาหนะ',
                items: [
                    { e: '🚗', n: 'รถยนต์' }, { e: '🚌', n: 'รถบัส' }, { e: '✈️', n: 'เครื่องบิน' },
                    { e: '🚀', n: 'จรวด' }, { e: '🚢', n: 'เรือ' }, { e: '🚂', n: 'รถไฟ' },
                    { e: '🚁', n: 'เฮลิคอปเตอร์' }, { e: '🚲', n: 'จักรยาน' }
                ]
            },
            {
                name: 'ขนมหวาน',
                items: [
                    { e: '🍦', n: 'ไอศกรีม' }, { e: '🍩', n: 'โดนัท' }, { e: '🧁', n: 'คัพเค้ก' },
                    { e: '🍰', n: 'เค้ก' }, { e: '🍭', n: 'อมยิ้ม' }, { e: '🍫', n: 'ช็อกโกแลต' }
                ]
            },
            {
                name: 'ของเล่นและของใช้',
                items: [
                    { e: '⚽', n: 'ลูกฟุตบอล' }, { e: '🧸', n: 'ตุ๊กตาหมี' }, { e: '🎨', n: 'จานสี' },
                    { e: '📚', n: 'หนังสือ' }, { e: '✏️', n: 'ดินสอ' }, { e: '🎈', n: 'ลูกโป่ง' }
                ]
            }
        ];

        let currentQ = 0, score = 0, isLocked = false, currentOddIndex = -1, oddItemName = '', groupCatName = '';
        const grid = document.getElementById('odd-grid');
        const qEl = document.getElementById('current-q');
        const scoreEl = document.getElementById('score');
        const modal = document.getElementById('victory-modal');

        let ws = null;
        try {
            ws = new WebSocket(`ws://${location.host || 'localhost:3001'}`);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'REGISTER', role: 'host' }));
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'TAP_CARD') check(d.index);
            };
        } catch(e){}

        // สุ่มโจทย์ใหม่ที่ไม่ซ้ำแบบ Procedural Generation
        function generateRandomPuzzle() {
            // สุ่มเลือกหมวดหมู่หลัก (3 ชิ้น) และหมวดหมู่แปลก (1 ชิ้น)
            const shuffledCats = [...CATEGORIES].sort(() => 0.5 - Math.random());
            const mainCat = shuffledCats[0];
            const oddCat = shuffledCats[1];

            const mainItem = mainCat.items[Math.floor(Math.random() * mainCat.items.length)];
            const oddItem = oddCat.items[Math.floor(Math.random() * oddCat.items.length)];

            oddItemName = oddItem.n;
            groupCatName = mainCat.name;

            // สร้าง 4 การ์ด (3 ตัวเหมือน + 1 ตัวต่าง)
            const cards = [
                { item: mainItem, isOdd: false },
                { item: mainItem, isOdd: false },
                { item: mainItem, isOdd: false },
                { item: oddItem, isOdd: true }
            ].sort(() => 0.5 - Math.random());

            currentOddIndex = cards.findIndex(c => c.isOdd);
            return cards.map(c => c.item);
        }

        function loadQuestion() {
            isLocked = false;
            qEl.textContent = currentQ + 1;
            const items = generateRandomPuzzle();

            grid.innerHTML = '';
            items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'odd-card';
                card.innerHTML = `
                    <span class="odd-num">${idx + 1}</span>
                    <span class="odd-emoji">${item.e}</span>
                    <span class="odd-label">${item.n}</span>
                `;
                card.addEventListener('click', () => check(idx));
                grid.appendChild(card);
            });

            soundManager.speakThai("ภาพไหนไม่เข้าพวกเอ่ย?");
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'SYNC_STATE',
                    pairs: 2,
                    matchedPairs: currentQ,
                    cards: items.map((it, i) => ({ index: i, emoji: it.e, name: it.n }))
                }));
            }
        }

        function check(idx) {
            if (isLocked) return;
            const cards = grid.children;
            if (idx === currentOddIndex) {
                isLocked = true;
                cards[idx].classList.add('correct');
                soundManager.playMatch();
                soundManager.speakThai(`ถูกต้องแล้วจ้า! ${oddItemName} ไม่ใช่ ${groupCatName}!`);
                score += 20;
                scoreEl.textContent = score;
                setTimeout(() => {
                    currentQ++;
                    if (currentQ < 5) loadQuestion();
                    else {
                        soundManager.playWin();
                        modal.classList.add('active');
                        if (ws) ws.send(JSON.stringify({ type: 'GAME_WON' }));
                    }
                }, 2000);
            } else {
                cards[idx].classList.add('wrong');
                soundManager.playMismatch();
                soundManager.speakThai("ยังไม่ใช่นะจ๊ะ สังเกตดูอีกที!");
                setTimeout(() => cards[idx].classList.remove('wrong'), 700);
            }
        }

        document.getElementById('btn-restart').onclick = () => { currentQ = 0; score = 0; scoreEl.textContent = '0'; loadQuestion(); };
        document.getElementById('btn-play-again').onclick = () => { modal.classList.remove('active'); currentQ = 0; score = 0; scoreEl.textContent = '0'; loadQuestion(); };
        document.body.onclick = () => soundManager.init();
        loadQuestion();
    </script>
</body>
</html>
