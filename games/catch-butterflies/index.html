<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>จับผีเสื้อหลากสีในสวน - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .garden-stage {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 480px;
            background: linear-gradient(180deg, #dbeafe 0%, #fbcfe8 50%, #bbf7d0 100%);
            border: 5px solid #ffffff;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
            cursor: pointer;
        }
        .butterfly-item {
            position: absolute;
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
            animation: wingFlutter 0.3s infinite alternate;
        }
        @keyframes wingFlutter {
            0% { transform: scaleX(1); }
            100% { transform: scaleX(0.7); }
        }
        .sparkle-effect {
            position: absolute;
            font-size: 3rem;
            pointer-events: none;
            animation: sparkleOut 0.5s ease-out forwards;
        }
        @keyframes sparkleOut {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .flower-bottom {
            position: absolute;
            bottom: 5px;
            font-size: 3rem;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <span class="title-emoji">🦋</span>
            <h1 class="game-title">จับผีเสื้อหลากสีในสวน</h1>
            <span class="title-emoji">🌸</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าหลัก">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-restart" class="btn-icon" title="เริ่มใหม่">
                <span>🔄</span> <span class="btn-text">เริ่มใหม่</span>
            </button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">🦋</span>
            <span>จับได้: <strong id="caught-count">0</strong> / 8 ตัว</span>
        </div>
        <div class="status-item">
            <span class="status-icon">✨</span>
            <span id="star-meter">⭐</span>
        </div>
    </div>

    <main class="garden-stage" id="garden-stage">
        <div class="flower-bottom" style="left: 30px;">🌸</div>
        <div class="flower-bottom" style="left: 140px;">🌻</div>
        <div class="flower-bottom" style="left: 280px;">🌷</div>
        <div class="flower-bottom" style="left: 420px;">🌼</div>
        <div class="flower-bottom" style="left: 560px;">🌺</div>
    </main>

    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-trophy">🏆</div>
            <h2 class="modal-title">จับผีเสื้อได้ครบแล้ว!</h2>
            <p class="modal-subtitle">หนูมีสายตาที่ไวมาก ช่วยจับผีเสื้อกลับสวนดอกไม้ได้ครบ 8 ตัว!</p>
            <div class="modal-stars">⭐⭐⭐</div>
            <button id="btn-play-again" class="btn-play-again">🎮 เล่นอีกรอบนะ!</button>
        </div>
    </div>

    <script src="../../sounds.js"></script>
    <script>
        const BF_COLORS = ['🦋', '✨', '🌸'];
        let caught = 0, isWon = false, butterflies = [], animId = null;
        const stage = document.getElementById('garden-stage');
        const caughtEl = document.getElementById('caught-count');
        const starMeter = document.getElementById('star-meter');
        const modal = document.getElementById('victory-modal');

        let ws = null;
        try {
            ws = new WebSocket(`ws://${location.host || 'localhost:3001'}`);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'REGISTER', role: 'host' }));
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'TAP_CARD') catchAny();
            };
        } catch(e){}

        function startGame() {
            caught = 0;
            isWon = false;
            caughtEl.textContent = '0';
            butterflies.forEach(b => b.el.remove());
            butterflies = [];

            for (let i = 0; i < 4; i++) spawnButterfly();
            soundManager.speakThai("แตะจับผีเสื้อแสนสวยในสวนดอกไม้เลยนะ!");
            loop();
            syncPhone();
        }

        function spawnButterfly() {
            if (butterflies.length >= 6) return;
            const el = document.createElement('div');
            el.className = 'butterfly-item';
            el.textContent = '🦋';

            const x = Math.random() * (stage.clientWidth - 80) + 20;
            const y = Math.random() * (stage.clientHeight - 120) + 30;
            const vx = (Math.random() - 0.5) * 2;
            const vy = (Math.random() - 0.5) * 2;

            el.style.left = `${x}px`;
            el.style.top = `${y}px`;

            const obj = { el, x, y, vx, vy };
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                catchButterfly(obj);
            });

            stage.appendChild(el);
            butterflies.push(obj);
        }

        function loop() {
            if (isWon) return;
            butterflies.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < 10 || b.x > stage.clientWidth - 70) b.vx *= -1;
                if (b.y < 20 || b.y > stage.clientHeight - 100) b.vy *= -1;

                b.el.style.left = `${b.x}px`;
                b.el.style.top = `${b.y}px`;
            });
            animId = requestAnimationFrame(loop);
        }

        function catchAny() {
            if (butterflies.length > 0) catchButterfly(butterflies[0]);
        }

        function catchButterfly(b) {
            if (isWon) return;
            soundManager.playMatch();

            const sp = document.createElement('div');
            sp.className = 'sparkle-effect';
            sp.textContent = '✨';
            sp.style.left = `${b.x}px`;
            sp.style.top = `${b.y}px`;
            stage.appendChild(sp);
            setTimeout(() => sp.remove(), 500);

            b.el.remove();
            butterflies = butterflies.filter(it => it !== b);

            caught++;
            caughtEl.textContent = caught;
            if (caught >= 4) starMeter.textContent = '⭐⭐';
            if (caught >= 8) starMeter.textContent = '⭐⭐⭐';

            soundManager.speakThai(`จับได้แล้ว! ${caught} ตัว`);

            if (caught < 8) {
                setTimeout(spawnButterfly, 600);
            } else {
                isWon = true;
                soundManager.playWin();
                modal.classList.add('active');
                if (ws) ws.send(JSON.stringify({ type: 'GAME_WON' }));
            }
            syncPhone();
        }

        function syncPhone() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'SYNC_STATE',
                    pairs: 2,
                    matchedPairs: Math.floor(caught / 2),
                    cards: [
                        { index: 0, emoji: '🦋', name: 'จับผีเสื้อ' },
                        { index: 1, emoji: '🌸', name: 'ในสวน' }
                    ]
                }));
            }
        }

        document.getElementById('btn-restart').onclick = startGame;
        document.getElementById('btn-play-again').onclick = () => { modal.classList.remove('active'); startGame(); };
        document.body.onclick = () => soundManager.init();
        startGame();
    </script>
</body>
</html>
