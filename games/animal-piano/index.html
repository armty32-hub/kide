<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เปียโนเสียงสัตว์น้อย - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .piano-stage {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 760px;
            width: 100%;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
        }
        .piano-hint {
            font-size: 1.35rem;
            font-weight: 700;
            color: #6b21a8;
            margin-bottom: 18px;
            text-align: center;
        }
        .piano-keys {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            padding: 10px 0;
            overflow-x: auto;
        }
        .piano-key {
            flex: 1;
            min-width: 70px;
            max-width: 90px;
            height: 240px;
            border-radius: 20px;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.15), 0 12px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 18px 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
            outline: none;
        }
        .piano-key:active, .piano-key.active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15), 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        .key-emoji {
            font-size: 3rem;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.15));
            transition: transform 0.2s;
        }
        .piano-key.active .key-emoji {
            transform: scale(1.3) rotate(-5deg);
        }
        .key-note {
            font-size: 1.3rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
        .song-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .song-btn {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: #f3e8ff;
            color: #7e22ce;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            transition: all 0.2s;
        }
        .song-btn:hover {
            background: #e9d5ff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <span class="title-emoji">🎹</span>
            <h1 class="game-title">เปียโนเสียงสัตว์น้อย</h1>
            <span class="title-emoji">🎵</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าสวนสนุก 31 เกม">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-phone-connect" class="btn-icon btn-phone" title="ใช้โทรศัพท์มือถือเป็นจอยกด">
                <span>📱</span> <span class="btn-text">ต่อจอยมือถือ</span>
            </button>
            <button id="btn-restart" class="btn-icon" title="เริ่มใหม่">
                <span>🔄</span> <span class="btn-text">เริ่มใหม่</span>
            </button>
        </div>
    </div>

    <main class="piano-stage">
        <div class="piano-hint" id="piano-hint">🎶 แตะคีย์เปียโนสายรุ้งเพื่อฟังเสียงสัตว์และเสียงดนตรีนะ!</div>
        <div class="piano-keys" id="piano-keys">
            <!-- คีย์เปียโน 8 ตัวโน้ต โด เร มี ฟา ซอล ลา ที โด -->
        </div>

        <div class="song-buttons">
            <button class="song-btn" id="btn-song-twinkle">⭐ เพลงดวงดาวน้อย (Twinkle)</button>
            <button class="song-btn" id="btn-song-lamb">🐑 เพลงลูกแกะน้อย</button>
        </div>
    </main>

    <script src="../memory-match/sounds.js"></script>
    <script src="game.js"></script>
</body>
</html>
