<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>รถไฟบวกเลขผจญภัย - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .train-stage {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 720px;
            width: 100%;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
            overflow: hidden;
        }
        .train-track {
            width: 100%;
            height: 160px;
            background: linear-gradient(180deg, #dbeafe 0%, #bfdbfe 70%, #94a3b8 71%, #64748b 100%);
            border-radius: 24px;
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 20px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .train-express {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            transition: transform 1s ease-in-out;
        }
        .train-express.moving {
            transform: translateX(120px);
        }
        .train-head {
            font-size: 5rem;
            line-height: 1;
        }
        .train-cart {
            width: 70px;
            height: 65px;
            background: #ffffff;
            border: 4px solid #2563eb;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: #1d4ed8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
        }
        .train-cart::after {
            content: '⚙️';
            position: absolute;
            bottom: -15px;
            font-size: 1.4rem;
        }
        .cart-op {
            font-size: 2.5rem;
            font-weight: 900;
            color: #1e3a8a;
        }
        .cart-question {
            background: #fef08a;
            border-color: #ca8a04;
            color: #854d0e;
        }
        .choices-row {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .train-choice-btn {
            width: 75px;
            height: 75px;
            border-radius: 24px;
            background: #ffffff;
            border: 4px solid #93c5fd;
            font-size: 2.2rem;
            font-weight: 900;
            color: #1d4ed8;
            box-shadow: 0 6px 0 #60a5fa;
            cursor: pointer;
            transition: all 0.15s;
        }
        .train-choice-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #60a5fa;
        }
        .train-choice-btn.correct {
            background: #22c55e;
            color: #ffffff;
            border-color: #16a34a;
        }
        .train-choice-btn.wrong {
            background: #ef4444;
            color: #ffffff;
            border-color: #dc2626;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <span class="title-emoji">🚂</span>
            <h1 class="game-title">รถไฟบวกเลขผจญภัย</h1>
            <span class="title-emoji">💨</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าหลัก">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-restart" class="btn-icon" title="เริ่มใหม่">
                <span>🔄</span> <span class="btn-text">เริ่มใหม่</span>
            </button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">⭐</span>
            <span>สถานีที่: <strong id="current-q">1</strong> / 5</span>
        </div>
        <div class="status-item">
            <span class="status-icon">🏆</span>
            <span>คะแนน: <strong id="score">0</strong></span>
        </div>
    </div>

    <main class="train-stage">
        <div style="font-size: 1.35rem; font-weight: 700; color: #1e40af; margin-bottom: 15px;">
            ช่วยเติมตัวเลขท้ายขบวน ให้รถไฟแล่นออกได้เลย! 🚂💨
        </div>

        <div class="train-track">
            <div class="train-express" id="train-express">
                <span class="train-head">🚂</span>
                <div class="train-cart" id="c1">3</div>
                <span class="cart-op">➕</span>
                <div class="train-cart" id="c2">2</div>
                <span class="cart-op">🟰</span>
                <div class="train-cart cart-question" id="c-ans">?</div>
            </div>
        </div>

        <div class="choices-row" id="choices-row"></div>
    </main>

    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-trophy">🏆</div>
            <h2 class="modal-title">รถไฟถึงสถานีปลายทางแล้ว!</h2>
            <p class="modal-subtitle">หนูบวกเลขให้ขบวนรถไฟถูกต้องทุกโบกี้เลย ปู๊นๆ!</p>
            <div class="modal-stars">⭐⭐⭐</div>
            <button id="btn-play-again" class="btn-play-again">🎮 เล่นอีกรอบนะ!</button>
        </div>
    </div>

    <script src="../../sounds.js"></script>
    <script>
        let currentQ = 0, score = 0, isLocked = false, currentSum = 0, choices = [];
        const train = document.getElementById('train-express');
        const c1 = document.getElementById('c1');
        const c2 = document.getElementById('c2');
        const cAns = document.getElementById('c-ans');
        const choicesRow = document.getElementById('choices-row');
        const qEl = document.getElementById('current-q');
        const scoreEl = document.getElementById('score');
        const modal = document.getElementById('victory-modal');

        let ws = null;
        try {
            ws = new WebSocket(`ws://${location.host || 'localhost:3001'}`);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'REGISTER', role: 'host' }));
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'TAP_CARD') check(d.index);
            };
        } catch(e){}

        function loadQuestion() {
            isLocked = false;
            qEl.textContent = currentQ + 1;
            train.className = 'train-express';
            cAns.textContent = '?';
            cAns.className = 'train-cart cart-question';

            const numA = Math.floor(Math.random() * 4) + 1;
            const numB = Math.floor(Math.random() * 4) + 1;
            currentSum = numA + numB;

            c1.textContent = numA;
            c2.textContent = numB;

            choices = [currentSum, currentSum + 1, Math.max(1, currentSum - 1)].sort(() => 0.5 - Math.random());
            choicesRow.innerHTML = '';
            choices.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'train-choice-btn';
                btn.textContent = c;
                btn.addEventListener('click', () => check(idx));
                choicesRow.appendChild(btn);
            });

            soundManager.speakThai(`${numA} บวก ${numB} ได้เท่าไหร่เอ่ย?`);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'SYNC_STATE',
                    pairs: 3,
                    matchedPairs: currentQ,
                    cards: choices.map((ch, i) => ({ index: i, emoji: `${ch}`, name: `เลข ${ch}` }))
                }));
            }
        }

        function check(idx) {
            if (isLocked) return;
            const btns = choicesRow.children;
            if (choices[idx] === currentSum) {
                isLocked = true;
                btns[idx].classList.add('correct');
                cAns.textContent = currentSum;
                cAns.className = 'train-cart';
                train.classList.add('moving');

                soundManager.playMatch();
                soundManager.speakThai(`ปู๊น ปู๊น! ถูกต้องแล้วจ้า เท่ากับ ${currentSum}!`);
                score += 20;
                scoreEl.textContent = score;
                setTimeout(() => {
                    currentQ++;
                    if (currentQ < 5) loadQuestion();
                    else {
                        soundManager.playWin();
                        modal.classList.add('active');
                        if (ws) ws.send(JSON.stringify({ type: 'GAME_WON' }));
                    }
                }, 2000);
            } else {
                btns[idx].classList.add('wrong');
                soundManager.playMismatch();
                soundManager.speakThai("ยังไม่ใช่นะจ๊ะ ลองบวกดูอีกที!");
                setTimeout(() => btns[idx].classList.remove('wrong'), 700);
            }
        }

        document.getElementById('btn-restart').onclick = () => { currentQ = 0; score = 0; scoreEl.textContent = '0'; loadQuestion(); };
        document.getElementById('btn-play-again').onclick = () => { modal.classList.remove('active'); currentQ = 0; score = 0; scoreEl.textContent = '0'; loadQuestion(); };
        document.body.onclick = () => soundManager.init();
        loadQuestion();
    </script>
</body>
</html>
