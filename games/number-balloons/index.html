<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เติมตัวเลขลูกโป่งเรียงลำดับ - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .num-balloon-stage {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 680px;
            width: 100%;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
        }
        .train-wrap {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin: 25px 0 35px;
            flex-wrap: wrap;
        }
        .balloon-node {
            width: 85px;
            height: 105px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            box-shadow: 0 8px 15px rgba(244, 114, 182, 0.35);
            position: relative;
        }
        .balloon-node.missing {
            background: #ffffff;
            border: 4px dashed #f472b6;
            color: #db2777;
            box-shadow: none;
            animation: pulse 1.5s infinite;
        }
        .choices-row {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .num-choice-btn {
            width: 75px;
            height: 75px;
            border-radius: 24px;
            background: #ffffff;
            border: 4px solid #fbcfe8;
            font-size: 2.2rem;
            font-weight: 900;
            color: #db2777;
            box-shadow: 0 6px 0 #f472b6;
            cursor: pointer;
            transition: all 0.15s;
        }
        .num-choice-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #f472b6;
        }
        .num-choice-btn.correct {
            background: #22c55e;
            color: #ffffff;
            border-color: #16a34a;
        }
        .num-choice-btn.wrong {
            background: #ef4444;
            color: #ffffff;
            border-color: #dc2626;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <span class="title-emoji">🎈</span>
            <h1 class="game-title">เติมตัวเลขลูกโป่งเรียงลำดับ</h1>
            <span class="title-emoji">🔢</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าหลัก">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-restart" class="btn-icon" title="เริ่มใหม่">
                <span>🔄</span> <span class="btn-text">เริ่มใหม่</span>
            </button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">⭐</span>
            <span>ข้อที่: <strong id="current-q">1</strong> / 5</span>
        </div>
        <div class="status-item">
            <span class="status-icon">🏆</span>
            <span>คะแนน: <strong id="score">0</strong></span>
        </div>
    </div>

    <main class="num-balloon-stage">
        <div style="font-size: 1.35rem; font-weight: 700; color: #9d174d; margin-bottom: 10px;">
            ลูกโป่งตัวเลขที่หายไป คือเลขอะไรเอ่ย? 🎈
        </div>

        <div class="train-wrap" id="train-wrap">
            <!-- ขบวนลูกโป่ง -->
        </div>

        <div class="choices-row" id="choices-row">
            <!-- 3 ช้อยส์ตัวเลข -->
        </div>
    </main>

    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-trophy">🏆</div>
            <h2 class="modal-title">เรียงเลขเก่งมากๆ!</h2>
            <p class="modal-subtitle">หนูเติมตัวเลขลูกโป่งเรียงลำดับได้ถูกต้องครบหมดเลย!</p>
            <div class="modal-stars">⭐⭐⭐</div>
            <button id="btn-play-again" class="btn-play-again">🎮 เล่นอีกรอบนะ!</button>
        </div>
    </div>

    <script src="../../sounds.js"></script>
    <script>
        const TOTAL_ROUNDS = 5;
        const BALLOON_COLORS = [
            'linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%)',
            'linear-gradient(135deg, #bae6fd 0%, #38bdf8 100%)',
            'linear-gradient(135deg, #bbf7d0 0%, #4ade80 100%)',
            'linear-gradient(135deg, #fef08a 0%, #facc15 100%)',
            'linear-gradient(135deg, #ddd6fe 0%, #a78bfa 100%)',
            'linear-gradient(135deg, #fed7aa 0%, #fb923c 100%)'
        ];

        function generateRound() {
            const length = 4;
            const start = Math.floor(Math.random() * 16) + 1;
            const seqFull = Array.from({length}, (_, i) => start + i);
            const missingIdx = Math.floor(Math.random() * length);
            const ans = seqFull[missingIdx];
            const seq = seqFull.map((num, i) => i === missingIdx ? '?' : num);

            const distractors = new Set();
            while (distractors.size < 2) {
                const offset = (Math.random() < 0.5 ? -1 : 1) * (Math.floor(Math.random() * 3) + 1);
                const cand = ans + offset;
                if (cand > 0 && cand !== ans) {
                    distractors.add(cand);
                } else {
                    const alt = Math.floor(Math.random() * 20) + 1;
                    if (alt !== ans) distractors.add(alt);
                }
            }
            const choices = [ans, ...distractors].sort(() => Math.random() - 0.5);
            return { seq, ans, choices };
        }

        let currentQ = 0, score = 0, isLocked = false, currentRound = null;
        const train = document.getElementById('train-wrap');
        const choicesRow = document.getElementById('choices-row');
        const qEl = document.getElementById('current-q');
        const scoreEl = document.getElementById('score');
        const modal = document.getElementById('victory-modal');

        let ws = null;
        try {
            ws = new WebSocket(`ws://${location.host || 'localhost:3001'}`);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'REGISTER', role: 'host' }));
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'TAP_CARD') check(d.index);
            };
        } catch(e){}

        function loadQuestion() {
            isLocked = false;
            qEl.textContent = currentQ + 1;
            currentRound = generateRound();
            const r = currentRound;
            const color = BALLOON_COLORS[currentQ % BALLOON_COLORS.length];

            train.innerHTML = '';
            r.seq.forEach(val => {
                const b = document.createElement('div');
                b.className = `balloon-node ${val === '?' ? 'missing' : ''}`;
                if (val !== '?') {
                    b.style.background = color;
                }
                b.textContent = val;
                train.appendChild(b);
            });

            choicesRow.innerHTML = '';
            r.choices.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'num-choice-btn';
                btn.textContent = c;
                btn.addEventListener('click', () => check(idx));
                choicesRow.appendChild(btn);
            });

            soundManager.speakThai("เลขไหนหายไปเอ่ย?");
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'SYNC_STATE',
                    pairs: 3,
                    matchedPairs: currentQ,
                    cards: r.choices.map((ch, i) => ({ index: i, emoji: `${ch}`, name: `เลข ${ch}` }))
                }));
            }
        }

        function check(idx) {
            if (isLocked) return;
            const r = currentRound;
            const btns = choicesRow.children;
            if (r.choices[idx] === r.ans) {
                isLocked = true;
                btns[idx].classList.add('correct');
                const missingNode = train.querySelector('.balloon-node.missing');
                if (missingNode) {
                    missingNode.textContent = r.ans;
                    missingNode.className = 'balloon-node';
                    missingNode.style.background = BALLOON_COLORS[currentQ % BALLOON_COLORS.length];
                }
                soundManager.playMatch();
                soundManager.speakThai(`ถูกต้องแล้วจ้า! คือเลข ${r.ans}!`);
                score += 20;
                scoreEl.textContent = score;
                setTimeout(() => {
                    currentQ++;
                    if (currentQ < TOTAL_ROUNDS) loadQuestion();
                    else {
                        soundManager.playWin();
                        modal.classList.add('active');
                        if (ws) ws.send(JSON.stringify({ type: 'GAME_WON' }));
                    }
                }, 2000);
            } else {
                btns[idx].classList.add('wrong');
                soundManager.playMismatch();
                soundManager.speakThai("ยังไม่ใช่นะจ๊ะ ลองนับเรียงดูอีกที!");
                setTimeout(() => btns[idx].classList.remove('wrong'), 700);
            }
        }

        document.getElementById('btn-restart').onclick = () => { currentQ = 0; score = 0; scoreEl.textContent = '0'; loadQuestion(); };
        document.getElementById('btn-play-again').onclick = () => { modal.classList.remove('active'); currentQ = 0; score = 0; scoreEl.textContent = '0'; loadQuestion(); };
        document.body.onclick = () => soundManager.init();
        loadQuestion();
    </script>
</body>
</html>
