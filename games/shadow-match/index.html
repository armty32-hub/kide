<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>จับคู่เงาปริศนา - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .shadow-stage {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            width: 100%;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
        }
        .mystery-box {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #e0e7ff 0%, #fae8ff 100%);
            border: 4px dashed #818cf8;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(129, 140, 248, 0.2);
        }
        .silhouette {
            font-size: 6rem;
            filter: brightness(0) drop-shadow(0 8px 10px rgba(0,0,0,0.3));
            transition: transform 0.3s, filter 0.5s;
        }
        .silhouette.revealed {
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
            animation: bounce 0.8s ease;
        }
        .question-hint {
            font-size: 1.35rem;
            font-weight: 700;
            color: #4338ca;
            margin-bottom: 20px;
            text-align: center;
        }
        .choices-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            width: 100%;
        }
        .choice-btn {
            background: #ffffff;
            border: 4px solid #e2e8f0;
            border-radius: 24px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 0 #cbd5e1, 0 8px 15px rgba(0,0,0,0.06);
            transition: all 0.2s;
            outline: none;
        }
        .choice-btn:hover {
            transform: translateY(-2px);
            border-color: #818cf8;
        }
        .choice-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #cbd5e1;
        }
        .choice-btn.correct {
            border-color: #22c55e;
            background: #f0fdf4;
            box-shadow: 0 6px 0 #86efac;
            animation: pulse 0.5s;
        }
        .choice-btn.wrong {
            border-color: #ef4444;
            background: #fef2f2;
            box-shadow: 0 6px 0 #fca5a5;
        }
        .choice-num {
            position: absolute;
            top: 8px;
            left: 10px;
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 700;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .choice-emoji {
            font-size: 3.5rem;
            margin-bottom: 4px;
        }
        .choice-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <header class="header">
        <div class="title-container">
            <span class="title-emoji">👤</span>
            <h1 class="game-title">จับคู่เงาปริศนา</h1>
            <span class="title-emoji">🔍</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าสวนสนุก 31 เกม">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-phone-connect" class="btn-icon btn-phone" title="ใช้โทรศัพท์มือถือเป็นจอยกด">
                <span>📱</span> <span class="btn-text">ต่อจอยมือถือ</span>
            </button>
            <button id="btn-restart" class="btn-icon" title="เริ่มเกมใหม่">
                <span>🔄</span> <span class="btn-text">เริ่มใหม่</span>
            </button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">⭐</span>
            <span>ข้อที่: <strong id="current-q">1</strong> / <strong id="total-q">5</strong></span>
        </div>
        <div class="status-item">
            <span class="status-icon">🏆</span>
            <span>คะแนน: <strong id="score">0</strong></span>
        </div>
    </div>

    <main class="shadow-stage">
        <div class="question-hint">เงาดำๆ นี้คือสัตว์ตัวไหนเอ่ย? 🤔</div>
        <div class="mystery-box">
            <div id="target-silhouette" class="silhouette">🐘</div>
        </div>
        <div class="choices-grid" id="choices-container">
            <!-- ตัวเลือกจะถูกสร้างด้วย JS -->
        </div>
    </main>

    <!-- หน้าต่างป๊อปอัปเมื่อชนะเกม -->
    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-trophy">🏆</div>
            <h2 class="modal-title">สุดยอดนักสังเกต!</h2>
            <p class="modal-subtitle">หนูทายเงาสัตว์ถูกหมดเลย เก่งมากๆ ครับ!</p>
            <div class="modal-stars">⭐⭐⭐</div>
            <button id="btn-play-again" class="btn-play-again">
                <span>🎮</span> เล่นอีกรอบนะ!
            </button>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="modal-overlay">
        <div class="modal-content qr-content">
            <button class="btn-close-modal" id="btn-close-qr">✕</button>
            <div class="qr-header">
                <span class="qr-icon">📱</span>
                <h2>ใช้มือถือเป็นจอยกด</h2>
            </div>
            <p class="qr-desc">ใช้กล้องโทรศัพท์มือถือสแกน QR Code ด้านล่างนี้ได้เลยครับ (ต่อ Wi-Fi เดียวกัน)</p>
            <div class="qr-image-container">
                <img id="qr-image" src="" alt="QR Code" style="display:none;">
                <div id="qr-loading" class="qr-loading">กำลังโหลด QR Code...</div>
            </div>
            <div class="qr-url-box">
                <a id="qr-link" href="#" target="_blank" class="url-link">-</a>
            </div>
        </div>
    </div>

    <script src="../memory-match/sounds.js"></script>
    <script src="game.js"></script>
</body>
</html>
