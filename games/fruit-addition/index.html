<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บวกเลขผลไม้หรรษา - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .addition-stage {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 720px;
            width: 100%;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
        }
        .math-formula {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: linear-gradient(180deg, #fff1f2 0%, #ffe4e6 100%);
            border: 4px solid #f43f5e;
            border-radius: 28px;
            padding: 20px;
            width: 100%;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .fruit-group {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.85);
            padding: 12px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            align-items: center;
            min-height: 80px;
        }
        .fruit-item {
            font-size: 3.2rem;
            animation: bounce 2s infinite ease-in-out;
        }
        .math-op {
            font-size: 3rem;
            font-weight: 900;
            color: #e11d48;
        }
        .answer-box {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: #ffffff;
            border: 4px dashed #f43f5e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            color: #e11d48;
            animation: pulse 1.5s infinite;
        }
        .choices-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }
        .choice-num-btn {
            width: 75px;
            height: 75px;
            border-radius: 24px;
            background: #ffffff;
            border: 4px solid #fecdd3;
            font-size: 2.2rem;
            font-weight: 900;
            color: #e11d48;
            box-shadow: 0 6px 0 #fda4af;
            cursor: pointer;
            transition: all 0.15s;
        }
        .choice-num-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #fda4af;
        }
        .choice-num-btn.correct {
            background: #22c55e;
            color: #ffffff;
            border-color: #16a34a;
        }
        .choice-num-btn.wrong {
            background: #ef4444;
            color: #ffffff;
            border-color: #dc2626;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <span class="title-emoji">🍎</span>
            <h1 class="game-title">บวกเลขผลไม้หรรษา</h1>
            <span class="title-emoji">➕</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าหลัก">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-restart" class="btn-icon" title="เริ่มใหม่">
                <span>🔄</span> <span class="btn-text">เริ่มใหม่</span>
            </button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">⭐</span>
            <span>ข้อที่: <strong id="current-q">1</strong> / 5</span>
        </div>
        <div class="status-item">
            <span class="status-icon">🏆</span>
            <span>คะแนน: <strong id="score">0</strong></span>
        </div>
    </div>

    <main class="addition-stage">
        <div style="font-size: 1.35rem; font-weight: 700; color: #be123c; margin-bottom: 15px;" id="question-label">
            นับผลไม้สองฝั่งรวมกัน ได้ทั้งหมดกี่ผลเอ่ย? 🍎
        </div>

        <div class="math-formula">
            <div class="fruit-group" id="left-group"></div>
            <span class="math-op">➕</span>
            <div class="fruit-group" id="right-group"></div>
            <span class="math-op">🟰</span>
            <div class="answer-box" id="answer-box">?</div>
        </div>

        <div class="choices-row" id="choices-row"></div>
    </main>

    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-trophy">🏆</div>
            <h2 class="modal-title">หนือบวกเลขเก่งมากๆ!</h2>
            <p class="modal-subtitle">รวมผลไม้ได้ถูกต้องครบทุกข้อเลย เก่งระดับอัจฉริยะน้อยเลยครับ!</p>
            <div class="modal-stars">⭐⭐⭐</div>
            <button id="btn-play-again" class="btn-play-again">🎮 เล่นอีกรอบนะ!</button>
        </div>
    </div>

    <script src="../../sounds.js"></script>
    <script>
        const FRUITS = ['🍎', '🍊', '🍓', '🍌', '🍇', '🍉', '🍍', '🍑', '🍒', '🥝', '🍋', '🍐', '🥭', '🥥', '🫐'];
        let currentQ = 0, score = 0, isLocked = false, currentSum = 0, choices = [];
        const leftGroup = document.getElementById('left-group');
        const rightGroup = document.getElementById('right-group');
        const ansBox = document.getElementById('answer-box');
        const choicesRow = document.getElementById('choices-row');
        const qEl = document.getElementById('current-q');
        const scoreEl = document.getElementById('score');
        const modal = document.getElementById('victory-modal');

        let ws = null;
        try {
            ws = new WebSocket(`ws://${location.host || 'localhost:3001'}`);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'REGISTER', role: 'host' }));
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'TAP_CARD') check(d.index);
            };
        } catch(e){}

        function loadQuestion() {
            isLocked = false;
            qEl.textContent = currentQ + 1;
            ansBox.textContent = '?';
            ansBox.style.border = '4px dashed #f43f5e';
            ansBox.style.background = '#ffffff';

            const fruit = FRUITS[Math.floor(Math.random() * FRUITS.length)];
            const numA = Math.floor(Math.random() * 3) + 1; // 1 to 3
            const numB = Math.floor(Math.random() * 3) + 1; // 1 to 3
            currentSum = numA + numB;

            leftGroup.innerHTML = '';
            for (let i = 0; i < numA; i++) {
                leftGroup.innerHTML += `<span class="fruit-item">${fruit}</span>`;
            }

            rightGroup.innerHTML = '';
            for (let i = 0; i < numB; i++) {
                rightGroup.innerHTML += `<span class="fruit-item">${fruit}</span>`;
            }

            // ตัวเลือกคำตอบ
            const wrongA = currentSum + 1;
            const wrongB = Math.max(1, currentSum - 1);
            choices = [currentSum, wrongA, wrongB].sort(() => 0.5 - Math.random());

            choicesRow.innerHTML = '';
            choices.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-num-btn';
                btn.textContent = c;
                btn.addEventListener('click', () => check(idx));
                choicesRow.appendChild(btn);
            });

            soundManager.speakThai(`ผลไม้สองฝั่งรวมกันเป็นเท่าไหร่เอ่ย?`);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'SYNC_STATE',
                    pairs: 3,
                    matchedPairs: currentQ,
                    cards: choices.map((ch, i) => ({ index: i, emoji: `${ch}`, name: `เลข ${ch}` }))
                }));
            }
        }

        function check(idx) {
            if (isLocked) return;
            const btns = choicesRow.children;
            if (choices[idx] === currentSum) {
                isLocked = true;
                btns[idx].classList.add('correct');
                ansBox.textContent = currentSum;
                ansBox.style.background = '#dcfce7';
                ansBox.style.border = '4px solid #16a34a';

                soundManager.playMatch();
                soundManager.speakThai(`ถูกต้องแล้วจ้า! รวมกันได้ ${currentSum} ผล! เก่งมาก!`);
                score += 20;
                scoreEl.textContent = score;
                setTimeout(() => {
                    currentQ++;
                    if (currentQ < 5) loadQuestion();
                    else {
                        soundManager.playWin();
                        modal.classList.add('active');
                        if (ws) ws.send(JSON.stringify({ type: 'GAME_WON' }));
                    }
                }, 2000);
            } else {
                btns[idx].classList.add('wrong');
                soundManager.playMismatch();
                soundManager.speakThai("ยังไม่ใช่นะจ๊ะ ลองนับรวมดูใหม่อีกที!");
                setTimeout(() => btns[idx].classList.remove('wrong'), 700);
            }
        }

        document.getElementById('btn-restart').onclick = () => { currentQ = 0; score = 0; scoreEl.textContent = '0'; loadQuestion(); };
        document.getElementById('btn-play-again').onclick = () => { modal.classList.remove('active'); currentQ = 0; score = 0; scoreEl.textContent = '0'; loadQuestion(); };
        document.body.onclick = () => soundManager.init();
        loadQuestion();
    </script>
</body>
</html>
