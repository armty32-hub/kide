<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ใครแอบอยู่หลังพุ่มไม้? - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .peek-stage {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 650px;
            width: 100%;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
        }
        .bush-container {
            position: relative;
            width: 220px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }
        .hiding-animal {
            font-size: 5.5rem;
            position: absolute;
            bottom: 20px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
        }
        .hiding-animal.peeking {
            transform: translateY(-20px);
        }
        .hiding-animal.revealed {
            transform: translateY(-70px) scale(1.3);
            animation: bounce 0.8s infinite ease-in-out;
            z-index: 10;
        }
        .bush-graphic {
            position: absolute;
            bottom: 0;
            font-size: 7rem;
            z-index: 5;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.15));
            animation: wiggleBush 3s infinite ease-in-out;
        }
        @keyframes wiggleBush {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }
        .choices-wrap {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }
        .peek-choice-btn {
            flex: 1;
            max-width: 160px;
            background: #ffffff;
            border: 4px solid #bbf7d0;
            border-radius: 24px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #86efac;
            transition: all 0.15s;
        }
        .peek-choice-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #86efac;
        }
        .peek-choice-btn.correct {
            border-color: #22c55e;
            background: #dcfce7;
        }
        .peek-choice-btn.wrong {
            border-color: #ef4444;
            background: #fee2e2;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <span class="title-emoji">🌿</span>
            <h1 class="game-title">ใครแอบอยู่หลังพุ่มไม้?</h1>
            <span class="title-emoji">👀</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าหลัก">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-restart" class="btn-icon" title="เริ่มใหม่">
                <span>🔄</span> <span class="btn-text">เริ่มใหม่</span>
            </button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">⭐</span>
            <span>ข้อที่: <strong id="current-q">1</strong> / 5</span>
        </div>
        <div class="status-item">
            <span class="status-icon">🏆</span>
            <span>คะแนน: <strong id="score">0</strong></span>
        </div>
    </div>

    <main class="peek-stage">
        <div style="font-size: 1.35rem; font-weight: 700; color: #166534; margin-bottom: 18px;">
            จ๊ะเอ๋! สัตว์ตัวไหนแอบอยู่ข้างหลังพุ่มไม้เอ่ย? 🌿
        </div>

        <div class="bush-container">
            <div id="hidden-animal" class="hiding-animal peeking">🐰</div>
            <div class="bush-graphic">🌳</div>
        </div>

        <div class="choices-wrap" id="choices-wrap">
            <!-- ตัวเลือก 3 ตัว -->
        </div>
    </main>

    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-trophy">🏆</div>
            <h2 class="modal-title">เก่งจังเลย จ๊ะเอ๋!</h2>
            <p class="modal-subtitle">หนูหาเพื่อนสัตว์ที่ซ่อนอยู่เจอครบทุกตัวเลย เก่งมากๆ ครับ!</p>
            <div class="modal-stars">⭐⭐⭐</div>
            <button id="btn-play-again" class="btn-play-again">🎮 เล่นอีกรอบนะ!</button>
        </div>
    </div>

    <script src="../../sounds.js"></script>
    <script>
        const ALL_ANIMALS = [
            { id: 'rabbit', e: '🐰', n: 'กระต่าย' },
            { id: 'elephant', e: '🐘', n: 'พี่ช้าง' },
            { id: 'lion', e: '🦁', n: 'สิงโต' },
            { id: 'cat', e: '🐱', n: 'น้องแมว' },
            { id: 'panda', e: '🐼', n: 'หมีแพนด้า' },
            { id: 'frog', e: '🐸', n: 'กบน้อย' },
            { id: 'monkey', e: '🐵', n: 'ลิงจ๋อ' },
            { id: 'dog', e: '🐶', n: 'น้องหมา' },
            { id: 'bear', e: '🐻', n: 'น้องหมี' },
            { id: 'tiger', e: '🐯', n: 'พี่เสือ' },
            { id: 'fox', e: '🦊', n: 'หมาจิ้งจอก' },
            { id: 'cow', e: '🐮', n: 'แม่วัว' },
            { id: 'pig', e: '🐷', n: 'หมูอู๊ดๆ' },
            { id: 'koala', e: '🐨', n: 'หมีโคอาล่า' },
            { id: 'penguin', e: '🐧', n: 'เพนกวิน' },
            { id: 'giraffe', e: '🦒', n: 'พี่ยีราฟ' },
            { id: 'zebra', e: '🦓', n: 'ม้าลาย' },
            { id: 'deer', e: '🦌', n: 'กวางน้อย' },
            { id: 'mouse', e: '🐭', n: 'หนูน้อย' },
            { id: 'owl', e: '🦉', n: 'นกฮูก' },
            { id: 'duck', e: '🦆', n: 'เป็ดก้าบๆ' },
            { id: 'chick', e: '🐥', n: 'ลูกเจี๊ยบ' }
        ];

        const TOTAL_ROUNDS = 5;
        let sessionAnimals = [];
        let currentQ = 0, score = 0, isLocked = false, targetAnimal = null, choices = [];
        const animalEl = document.getElementById('hidden-animal');
        const choicesWrap = document.getElementById('choices-wrap');
        const qEl = document.getElementById('current-q');
        const scoreEl = document.getElementById('score');
        const modal = document.getElementById('victory-modal');

        let ws = null;
        try {
            ws = new WebSocket(`ws://${location.host || 'localhost:3001'}`);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'REGISTER', role: 'host' }));
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'TAP_CARD') check(d.index);
            };
        } catch(e){}

        function initSession() {
            sessionAnimals = [...ALL_ANIMALS].sort(() => 0.5 - Math.random()).slice(0, TOTAL_ROUNDS);
            currentQ = 0;
            score = 0;
            scoreEl.textContent = '0';
            loadQuestion();
        }

        function loadQuestion() {
            isLocked = false;
            qEl.textContent = currentQ + 1;
            animalEl.className = 'hiding-animal peeking';

            targetAnimal = sessionAnimals[currentQ];
            const otherAnimals = ALL_ANIMALS.filter(a => a.id !== targetAnimal.id);
            const distractors = otherAnimals.sort(() => 0.5 - Math.random()).slice(0, 2);
            choices = [targetAnimal, ...distractors].sort(() => 0.5 - Math.random());

            animalEl.textContent = targetAnimal.e;
            choicesWrap.innerHTML = '';
            choices.forEach((c, idx) => {
                const btn = document.createElement('button');
                btn.className = 'peek-choice-btn';
                btn.innerHTML = `<span style="font-size:3rem;">${c.e}</span><span style="font-size:1.1rem;font-weight:700;margin-top:4px;">${c.n}</span>`;
                btn.addEventListener('click', () => check(idx));
                choicesWrap.appendChild(btn);
            });

            soundManager.speakThai("สัตว์ตัวไหนแอบอยู่ข้างหลังพุ่มไม้เอ่ย?");
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'SYNC_STATE',
                    pairs: 3,
                    matchedPairs: currentQ,
                    cards: choices.map((ch, i) => ({ index: i, emoji: ch.e, name: ch.n }))
                }));
            }
        }

        function check(idx) {
            if (isLocked) return;
            const btns = choicesWrap.children;
            if (choices[idx].id === targetAnimal.id) {
                isLocked = true;
                btns[idx].classList.add('correct');
                animalEl.className = 'hiding-animal revealed';
                soundManager.playMatch();
                soundManager.speakThai(`จ๊ะเอ๋! นี่คือ${targetAnimal.n}เองจ้า!`);
                score += 20;
                scoreEl.textContent = score;
                setTimeout(() => {
                    currentQ++;
                    if (currentQ < TOTAL_ROUNDS) loadQuestion();
                    else {
                        soundManager.playWin();
                        modal.classList.add('active');
                        if (ws) ws.send(JSON.stringify({ type: 'GAME_WON' }));
                    }
                }, 2000);
            } else {
                btns[idx].classList.add('wrong');
                soundManager.playMismatch();
                soundManager.speakThai("ยังไม่ใช่นะจ๊ะ ลองดูอีกที!");
                setTimeout(() => btns[idx].classList.remove('wrong'), 700);
            }
        }

        document.getElementById('btn-restart').onclick = initSession;
        document.getElementById('btn-play-again').onclick = () => { modal.classList.remove('active'); initSession(); };
        document.body.onclick = () => soundManager.init();
        initSession();
    </script>
</body>
</html>
