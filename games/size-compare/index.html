<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เทียบขนาด ใหญ่-กลาง-เล็ก - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .size-stage {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 680px;
            width: 100%;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
        }
        .size-prompt {
            font-size: 1.45rem;
            font-weight: 700;
            color: #1d4ed8;
            margin-bottom: 25px;
            text-align: center;
        }
        .size-row {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
            width: 100%;
            min-height: 220px;
            margin-bottom: 20px;
        }
        .size-item-card {
            background: #ffffff;
            border: 4px solid #bfdbfe;
            border-radius: 24px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 0 #93c5fd;
            transition: all 0.2s;
            position: relative;
        }
        .size-item-card:hover {
            border-color: #3b82f6;
            transform: translateY(-4px);
        }
        .size-item-card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #93c5fd;
        }
        .size-item-card.correct {
            border-color: #22c55e;
            background: #f0fdf4;
            animation: bounce 0.6s;
        }
        .size-item-card.wrong {
            border-color: #ef4444;
            background: #fee2e2;
        }
        .item-small { font-size: 2.5rem; width: 100px; height: 120px; }
        .item-medium { font-size: 4rem; width: 130px; height: 160px; }
        .item-big { font-size: 5.8rem; width: 160px; height: 200px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <span class="title-emoji">🐘</span>
            <h1 class="game-title">เทียบขนาด ใหญ่-กลาง-เล็ก</h1>
            <span class="title-emoji">🐭</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าหลัก">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-restart" class="btn-icon" title="เริ่มใหม่">
                <span>🔄</span> <span class="btn-text">เริ่มใหม่</span>
            </button>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-icon">⭐</span>
            <span>ข้อที่: <strong id="current-q">1</strong> / 5</span>
        </div>
        <div class="status-item">
            <span class="status-icon">🏆</span>
            <span>คะแนน: <strong id="score">0</strong></span>
        </div>
    </div>

    <main class="size-stage">
        <div class="size-prompt" id="size-prompt">ตัวไหนมีขนาด "ใหญ่ที่สุด" เอ่ย? แตะเลย! 🔍</div>
        <div class="size-row" id="size-row">
            <!-- 3 ขนาด -->
        </div>
    </main>

    <div id="victory-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-trophy">🏆</div>
            <h2 class="modal-title">เก่งมาก รู้จักขนาดแล้ว!</h2>
            <p class="modal-subtitle">หนูแยกแยะขนาดใหญ่ กลาง เล็ก ได้ถูกต้องครบทุกข้อเลย!</p>
            <div class="modal-stars">⭐⭐⭐</div>
            <button id="btn-play-again" class="btn-play-again">🎮 เล่นอีกรอบนะ!</button>
        </div>
    </div>

    <script src="../../sounds.js"></script>
    <script>
        const ALL_THEMES = [
            { e: '🐻', n: 'น้องหมี' },
            { e: '🍎', n: 'แอปเปิ้ล' },
            { e: '🚗', n: 'รถยนต์' },
            { e: '⭐', n: 'ดวงดาว' },
            { e: '🎈', n: 'ลูกโป่ง' },
            { e: '🦖', n: 'ไดโนเสาร์' },
            { e: '🦁', n: 'สิงโต' },
            { e: '🚀', n: 'จรวด' },
            { e: '🍰', n: 'เค้กหวาน' },
            { e: '🍦', n: 'ไอศกรีม' },
            { e: '👑', n: 'มงกุฎ' },
            { e: '🎁', n: 'กล่องของขวัญ' },
            { e: '⚽', n: 'ลูกบอล' },
            { e: '🐶', n: 'น้องหมา' },
            { e: '🐱', n: 'น้องแมว' },
            { e: '🐘', n: 'พี่ช้าง' },
            { e: '🍓', n: 'สตรอว์เบอร์รี' },
            { e: '🌻', n: 'ดอกทานตะวัน' },
            { e: '🍄', n: 'เห็ดน้อย' },
            { e: '🐠', n: 'ปลาทอง' },
            { e: '🐢', n: 'เต่าน้อย' },
            { e: '🦋', n: 'ผีเสื้อ' },
            { e: '🍉', n: 'แตงโม' },
            { e: '🍩', n: 'โดนัท' }
        ];

        const TOTAL_ROUNDS = 5;
        let sessionThemes = [];
        let currentQ = 0, score = 0, isLocked = false, isLookingForBig = true, correctIdx = 0;
        const promptEl = document.getElementById('size-prompt');
        const row = document.getElementById('size-row');
        const qEl = document.getElementById('current-q');
        const scoreEl = document.getElementById('score');
        const modal = document.getElementById('victory-modal');

        let ws = null;
        try {
            ws = new WebSocket(`ws://${location.host || 'localhost:3001'}`);
            ws.onopen = () => ws.send(JSON.stringify({ type: 'REGISTER', role: 'host' }));
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'TAP_CARD') check(d.index);
            };
        } catch(e){}

        function initSession() {
            sessionThemes = [...ALL_THEMES].sort(() => 0.5 - Math.random()).slice(0, TOTAL_ROUNDS);
            currentQ = 0;
            score = 0;
            scoreEl.textContent = '0';
            loadQuestion();
        }

        function loadQuestion() {
            isLocked = false;
            qEl.textContent = currentQ + 1;
            isLookingForBig = Math.random() > 0.5;
            promptEl.textContent = isLookingForBig ? 'ภาพไหนมีขนาด "ใหญ่ที่สุด" เอ่ย? 🐘' : 'ภาพไหนมีขนาด "เล็กที่สุด" เอ่ย? 🐭';

            const theme = sessionThemes[currentQ];
            const sizes = [
                { size: 'small', cls: 'item-small', label: 'เล็ก' },
                { size: 'medium', cls: 'item-medium', label: 'กลาง' },
                { size: 'big', cls: 'item-big', label: 'ใหญ่' }
            ].sort(() => 0.5 - Math.random());

            correctIdx = sizes.findIndex(s => isLookingForBig ? s.size === 'big' : s.size === 'small');

            row.innerHTML = '';
            sizes.forEach((s, idx) => {
                const card = document.createElement('div');
                card.className = `size-item-card ${s.cls}`;
                card.innerHTML = `<span>${theme.e}</span>`;
                card.addEventListener('click', () => check(idx));
                row.appendChild(card);
            });

            soundManager.speakThai(isLookingForBig ? "ภาพไหนใหญ่ที่สุดเอ่ย?" : "ภาพไหนเล็กที่สุดเอ่ย?");
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'SYNC_STATE',
                    pairs: 3,
                    matchedPairs: currentQ,
                    cards: sizes.map((s, i) => ({ index: i, emoji: theme.e, name: s.label }))
                }));
            }
        }

        function check(idx) {
            if (isLocked) return;
            const cards = row.children;
            if (idx === correctIdx) {
                isLocked = true;
                cards[idx].classList.add('correct');
                soundManager.playMatch();
                soundManager.speakThai(`ถูกต้องแล้วจ้า! นี่คือขนาด${isLookingForBig ? 'ใหญ่ที่สุด' : 'เล็กที่สุด'} เก่งมาก!`);
                score += 20;
                scoreEl.textContent = score;
                setTimeout(() => {
                    currentQ++;
                    if (currentQ < TOTAL_ROUNDS) loadQuestion();
                    else {
                        soundManager.playWin();
                        modal.classList.add('active');
                        if (ws) ws.send(JSON.stringify({ type: 'GAME_WON' }));
                    }
                }, 2000);
            } else {
                cards[idx].classList.add('wrong');
                soundManager.playMismatch();
                soundManager.speakThai("ยังไม่ใช่นะจ๊ะ ลองดูขนาดอีกทีนะ!");
                setTimeout(() => cards[idx].classList.remove('wrong'), 700);
            }
        }

        document.getElementById('btn-restart').onclick = initSession;
        document.getElementById('btn-play-again').onclick = () => { modal.classList.remove('active'); initSession(); };
        document.body.onclick = () => soundManager.init();
        initSession();
    </script>
</body>
</html>
