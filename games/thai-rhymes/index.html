<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บทกลอนและเพลงเด็กอนุบาล - สวนสนุกเสริมพัฒนาการ</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .rhyme-stage {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 720px;
            width: 100%;
            box-shadow: var(--shadow-soft);
            margin-top: 10px;
        }
        .song-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .song-tab {
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 25px;
            border: none;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .song-tab.active {
            background: #db2777;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(219, 39, 119, 0.35);
        }
        .karaoke-display {
            width: 100%;
            min-height: 180px;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            border: 4px solid #f472b6;
            border-radius: 28px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(244, 114, 182, 0.15);
        }
        .singer-art {
            font-size: 5rem;
            margin-bottom: 12px;
            animation: bounce 1.5s infinite ease-in-out;
        }
        .lyrics-line {
            font-size: 1.8rem;
            font-weight: 700;
            color: #831843;
            line-height: 1.5;
            transition: transform 0.2s;
        }
        .btn-sing {
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 12px 32px;
            border-radius: 35px;
            border: none;
            background: linear-gradient(135deg, #db2777 0%, #be185d 100%);
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(219, 39, 119, 0.35);
            transition: transform 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-sing:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="title-container">
            <span class="title-emoji">🎤</span>
            <h1 class="game-title">บทกลอนและเพลงเด็กอนุบาล</h1>
            <span class="title-emoji">🎶</span>
        </div>
    </header>

    <div class="controls-container">
        <div class="action-buttons">
            <a href="/" class="btn-icon btn-home" title="กลับหน้าหลัก">
                <span>🏠</span> <span class="btn-text">กลับหน้าหลัก</span>
            </a>
            <button id="btn-restart" class="btn-icon" title="ร้องใหม่">
                <span>🔄</span> <span class="btn-text">เริ่มใหม่</span>
            </button>
        </div>
    </div>

    <main class="rhyme-stage">
        <div class="song-selector">
            <button class="song-tab active" onclick="selectSong(0)">🐘 เพลงช้าง</button>
            <button class="song-tab" onclick="selectSong(1)">🦀 เพลงจับปูดำ</button>
            <button class="song-tab" onclick="selectSong(2)">✂️ กรรไกร ไข่ ผ้าไหม</button>
            <button class="song-tab" onclick="selectSong(3)">🦆 เพลงเป็ดอาบน้ำ</button>
            <button class="song-tab" onclick="selectSong(4)">🕷️ เพลงแมงมุมลาย</button>
            <button class="song-tab" onclick="selectSong(5)">🐒 เพลงเจ้าลิงจ๋อ</button>
        </div>

        <div class="karaoke-display">
            <div class="singer-art" id="singer-art">🐘</div>
            <div class="lyrics-line" id="lyrics-line">ช้าง ช้าง ช้าง น้องเคยเห็นช้างหรือเปล่า?</div>
        </div>

        <button class="btn-sing" id="btn-sing" onclick="singSong()">
            <span>▶️</span> แตะเพื่อร้องเพลงพร้อมกัน!
        </button>
    </main>

    <script src="../../sounds.js"></script>
    <script>
        const SONGS = [
            {
                art: '🐘',
                title: 'เพลงช้าง',
                lines: [
                    'ช้าง ช้าง ช้าง... น้องเคยเห็นช้างหรือเปล่า?',
                    'ช้างมันตัวโตไม่เบา...',
                    'จมูกยาวๆ เรียกว่างวง...',
                    'มีเขี้ยวใต้งวง เรียกว่างา...',
                    'มีหู มีตา หางยาว!'
                ]
            },
            {
                art: '🦀',
                title: 'เพลงจับปูดำ',
                lines: [
                    'จับปูดำ... ขยำปูนา...',
                    'จับปูม้า... คว้าปูทะเล...',
                    'สนุกจริงเอย... แล้วเลยนอนเปล...',
                    'ชะโอละเห่... นอนเปลหลับไป!'
                ]
            },
            {
                art: '✂️',
                title: 'กรรไกร ไข่ ผ้าไหม',
                lines: [
                    'กรรไกร... ไข่... ผ้าไหม...',
                    'ไข่หนึ่งใบ สองบาทห้าสิบ...',
                    'ห้าสิบบาท สองบาทหนึ่งใบ...',
                    'ไข่... ผ้าไหม... กรรไกร!'
                ]
            },
            {
                art: '🦆',
                title: 'เป็ดอาบน้ำ',
                lines: [
                    'ก้าบ ก้าบ ก้าบ... เป็ดอาบน้ำในคลอง...',
                    'ตาก็จ้องแลมอง...',
                    'เพราะในคลองมีหอย ปู ปลา!',
                    'ก้าบ ก้าบ ก้าบ... เป็ดอาบน้ำในคู...',
                    'ตาก็จ้องแลดู...',
                    'เพราะในคูมีหอย ปู ปลา!'
                ]
            },
            {
                art: '🕷️',
                title: 'แมงมุมลาย',
                lines: [
                    'แมงมุมลายตัวนั้น... ฉันเห็นมันซมซานเหลือทน...',
                    'วันหนึ่งมันเปียกฝน... ไหลหล่นจากบนหลังคา...',
                    'พระอาทิตย์ส่องแสง... น้ำแห้งเหือดไปลับตา...',
                    'มันรีบไต่ขึ้นฝา... หันหลังมาทำตาลุกวาว!'
                ]
            },
            {
                art: '🐒',
                title: 'เจ้าลิงจ๋อ',
                lines: [
                    'เจี๊ยก เจี๊ยก เจี๊ยก... เป็นเสียงเรียกของลิง...',
                    'ลิงมันไม่อยู่นิ่ง... มันชอบวิ่งกระโดดไปมา...',
                    'เจี๊ยก เจี๊ยก เจี๊ยก... มันร้องเรียกพวกมา...',
                    'ครั้นพอถึงเวลา... ออกเที่ยวหากล้วยกิน!'
                ]
            }
        ];

        let songIdx = 0, isSinging = false;
        const artEl = document.getElementById('singer-art');
        const lyricsEl = document.getElementById('lyrics-line');

        let ws = null;
        try {
            ws = new WebSocket(`ws://${location.host || 'localhost:3001'}`);
            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'REGISTER', role: 'host' }));
                syncPhone();
            };
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d.type === 'TAP_CARD') {
                    if (d.index >= 0 && d.index < SONGS.length) selectSong(d.index);
                }
            };
        } catch(e){}

        function selectSong(idx) {
            songIdx = idx;
            document.querySelectorAll('.song-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
            const s = SONGS[songIdx];
            artEl.textContent = s.art;
            lyricsEl.textContent = s.lines[0];
            syncPhone();
        }

        async function singSong() {
            if (isSinging) return;
            isSinging = true;
            soundManager.init();
            const s = SONGS[songIdx];

            for (let i = 0; i < s.lines.length; i++) {
                lyricsEl.textContent = s.lines[i];
                lyricsEl.style.transform = 'scale(1.1)';
                soundManager.speakThai(s.lines[i]);
                await new Promise(r => setTimeout(r, 2300));
                lyricsEl.style.transform = 'scale(1)';
            }

            soundManager.playMatch();
            soundManager.speakThai("เก่งมากเลย ร้องเพลงเพราะจังเลย!");
            isSinging = false;
        }

        function syncPhone() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'SYNC_STATE',
                    pairs: SONGS.length,
                    matchedPairs: songIdx,
                    cards: SONGS.map((s, idx) => ({ index: idx, emoji: s.art, name: s.title }))
                }));
            }
        }

        document.getElementById('btn-restart').onclick = singSong;
        document.body.onclick = () => soundManager.init();
    </script>
</body>
</html>
